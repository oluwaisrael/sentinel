name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      NuGetAuditMode: all
      NuGetAuditLevel: high
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Restore
        run: dotnet restore Sentinel.slnx -p:NuGetAuditMode=all -p:NuGetAuditLevel=high
      - name: Build
        run: dotnet build Sentinel.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test Sentinel.slnx --no-build --configuration Release --logger "console;verbosity=minimal"
      - name: Vulnerability audit
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Sentinel.slnx package --vulnerable --include-transitive | tee vulnerability-report.txt
          if grep -Eiq '(^|[[:space:]])(High|Critical)([[:space:]]|$)' vulnerability-report.txt; then
            echo "Actionable high or critical NuGet vulnerability detected."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build dashboard
        working-directory: web
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file Dockerfile.api --tag sentinel-api:ci .
      - name: Build worker image
        run: docker build --file Dockerfile.worker --tag sentinel-worker:ci .
      - name: Build migration image
        run: docker build --file Dockerfile.migrations --tag sentinel-migrations:ci .
      - name: Build dashboard image
        run: docker build --file web/Dockerfile --tag sentinel-web:ci web
